<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Darija Translator – Settings</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css">
  <style>
    body { max-width: 520px; margin: 32px auto; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
    input { font-weight: 400; }
    .buttons { display: flex; gap: 8px; }
    .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="../icons/icon48.png" alt="" width="36" height="36"><h1>Darija Translator settings</h1></div>
    <form id="form" class="card">
      <label>Server URL
        <input type="url" id="serverUrl" required placeholder="http://localhost:8080">
        <span class="hint">Where the Java REST service runs. The extension calls <code>/api/translate</code> on it.</span>
      </label>
      <label>Username
        <input type="text" id="username" required autocomplete="username">
      </label>
      <label>Password
        <input type="password" id="password" required autocomplete="current-password">
        <span class="hint">Sent with HTTP Basic authentication. Use HTTPS when the server is not on your own machine.</span>
      </label>
      <div class="buttons">
        <button type="submit" class="primary">Save</button>
        <button type="button" id="testBtn" class="ghost">Test connection</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
